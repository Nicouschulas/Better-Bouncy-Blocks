name: BetterBouncyBlocks
version: '${project.version}'
main: de.nicouschulas.betterbouncyblocks.BetterBouncyBlocks
api-version: '1.21'
author: Nicouschulas
description: A lightweight trampoline plugin which supports custom blocks, consumable blocks, Vault economy, WorldGuard and much more!
softdepend: [WorldGuard, Vault]

commands:
  bbb:
    description: Manages Better Bouncy Blocks commands.
    usage: "Usage: /bbb [reload | give <player> <amount> | buy <amount>]"
    aliases:
      - betterbouncyblocks

permissions:
  betterbouncyblocks.admin:
    description: Parent permission for all administrative commands and usage.
    default: op
    children:
      betterbouncyblocks.reload: true
      betterbouncyblocks.give: true
      betterbouncyblocks.update: true
      betterbouncyblocks.use: true

  betterbouncyblocks.use:
    description: Allows players to use standard bouncy blocks.
    default: true

  betterbouncyblocks.use.consumable:
    description: Allows players to use consumable bouncy blocks.
    default: true

  betterbouncyblocks.buy:
    description: Allows players to buy consumable bouncy blocks.
    default: true

  betterbouncyblocks.give:
    description: Allows administrators to give consumable bouncy blocks to players.
    default: op

  betterbouncyblocks.reload:
    description: Reloads the Better Bouncy Blocks plugin configuration.
    default: op

  betterbouncyblocks.update:
    description: Allows a player to receive in-game update notifications.
    default: op