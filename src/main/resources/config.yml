# --- standard block configuration ---

# The block material you want to use as a permanent trampoline.
# Make sure to use uppercase letters (e.g. SLIME_BLOCK, SPONGE)
block: SLIME_BLOCK

# How high should the player fly? (Velocity multiplier)
velocity-multiplier: 2.0

# How many ticks should the player be protected from fall damage after bouncing?
# (20 ticks = 1 second, so 50 ticks = 2.5 seconds)
no-damage-ticks: 0

# WorldGuard settings for permanent bouncy blocks
worldguard:
  # Set to true to restrict trampolines to specific WorldGuard regions.
  # Requires WorldGuard to be installed on the server.
  enabled: false

  # List the region IDs where Better Bouncy Blocks should work.
  # ALWAYS use lowercase letters for region names here!
  regions:
    - "spawn"
    - "lobby"
    - "trampoline_arena"


# --- consumable block configuration ---

consumable-block:
  # Enable or disable the consumable bouncy block feature
  enabled: false

  # The block material you want to use as a temporal trampoline.
  # Make sure to use uppercase letters (e.g. SLIME_BLOCK, SPONGE)
  block: MAGENTA_GLAZED_TERRACOTTA

  # How high should the player fly? (Velocity multiplier)
  velocity-multiplier: 1.5

  # How many ticks should the player be protected from fall damage after bouncing?
  # (20 ticks = 1 second, so 40 ticks = 2.0 seconds)
  no-damage-ticks: 40

  # Price per block when purchased via /bbb buy (Requires Vault)
  price: 50.0

  # WorldGuard settings specifically for consumable blocks
  worldguard:
    # Set to true to restrict temporal trampolines to specific WorldGuard regions.
    # Requires WorldGuard to be installed on the server.
    enabled: false

    # List the region IDs where Better Bouncy Blocks should work.
    # ALWAYS use lowercase letters for region names here!
    regions:
      - "spawn"
      - "arena"
      - "trampoline_arena"

# --- update checker configuration ---

update-checker:
  # Enable/disable the update checker
  enabled: true
  # How should update notifications be displayed?
  # Options: "console", "player" or "both"
  notify-method: both


# --- prefix configuration ---

# BetterBouncyBlocks supports both Legacy (&) and MiniMessage tags!
# Example Legacy: "&7[&cBBB&7] "
# Example MiniMessage: "<gradient:#ff5f6d:#ffc371>[BBB]</gradient> "
prefix: "&7[&cBBB&7] " # Don't forget the space at the end!


# --- message configuration ---

# BetterBouncyBlocks supports both Legacy (&) and MiniMessage tags!
# Example Legacy: "&cYou do not have permission to use this command!"
# Example MiniMessage: "<red>You do not have permission to use this command!</red>"
messages:
  no-permission: "&cYou do not have permission to use this command!"
  reload-success: "&aBetter Bouncy Blocks reloaded successfully!"
  command-usage: "&cUsage: &7/&cbbb [reload | give <player> <amount> | buy <amount>]"
  player-not-found: "&cPlayer not found or offline!"
  invalid-amount: "&cPlease specify a valid positive number!"
  give-success: "&aGave &e%amount%x %block% &ato &e%player%&a!"
  receive-success: "&aYou received &e%amount%x %block%&a!"
  buy-success: "&aYou bought &e%amount%x %block% &afor &e%price%&a!"
  not-enough-money: "&cYou need &e%price% &cto buy this amount!"
  vault-disabled: "&cVault is not installed or no economy plugin was found!"
  consumable-disabled: "&cConsumable bouncy blocks are currently disabled!"
  inventory-full: "&cYour inventory is full!"